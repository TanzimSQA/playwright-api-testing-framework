[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = 
    -v 
    -s 
    --html=reports/report.html 
    --self-contained-html
    --tb=short

markers =
    smoke: Critical path smoke tests for quick validation
    regression: Comprehensive test suite across all services
    auth: Authentication and authorization validation tests
    products: Product catalog, CRUD, query, and category tests
    users: User directory and retrieval tests
    e2e: End-to-end multi-step workflow integration tests
    performance: Response latency SLA benchmark tests

log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)
log_cli_date_format = %Y-%m-%d %H:%M:%S
